services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      AI_BACKEND: ${AI_BACKEND:-stub}
      LOCAL_MODEL_URL: ${LOCAL_MODEL_URL:-http://local-model:11434}
      FACEFLAG_TIER: ${FACEFLAG_TIER:-frugal}
    depends_on:
      local-model:
        condition: service_started
        required: false
  local-model:
    image: ollama/ollama:latest
    profiles: [ "local-model" ]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
volumes:
  ollama-data:
